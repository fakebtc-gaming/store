<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FakeBTC Store</title>
  <meta name="description" content="FakeBTC — Gear up with the best gaming peripherals and streaming equipment.">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
  <style>
    /* Dark gaming store — cyan neon on deep slate */
    :root {
      --bg: #0c0e14;
      --bg-card: #141722;
      --bg-card-hover: #1a1e2e;
      --fg: #e2e4ea;
      --fg-dim: #7a7f92;
      --accent: #00e5ff;
      --accent-glow: rgba(0, 229, 255, 0.25);
      --accent-dim: #007a8a;
      --badge-bg: rgba(0, 229, 255, 0.12);
      --border: rgba(255, 255, 255, 0.06);
      --radius: 14px;
      --font-display: 'Chakra Petch', sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
      color-scheme: dark;
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f0f2f5;
        --bg-card: #ffffff;
        --bg-card-hover: #f7f8fa;
        --fg: #1a1c24;
        --fg-dim: #6b6f80;
        --accent: #0097a7;
        --accent-glow: rgba(0, 151, 167, 0.18);
        --accent-dim: #006874;
        --badge-bg: rgba(0, 151, 167, 0.1);
        --border: rgba(0, 0, 0, 0.08);
        color-scheme: light;
      }
    }
    :root[data-theme="light"] {
      --bg: #f0f2f5;
      --bg-card: #ffffff;
      --bg-card-hover: #f7f8fa;
      --fg: #1a1c24;
      --fg-dim: #6b6f80;
      --accent: #0097a7;
      --accent-glow: rgba(0, 151, 167, 0.18);
      --accent-dim: #006874;
      --badge-bg: rgba(0, 151, 167, 0.1);
      --border: rgba(0, 0, 0, 0.08);
      color-scheme: light;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    img { max-width: 100%; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* Ambient glow background */
    .bg-glow {
      position: fixed;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: pulse-glow 6s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; transform: translateX(-50%) scale(1); }
      50% { opacity: 0.7; transform: translateX(-50%) scale(1.15); }
    }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 16px 60px;
    }

    /* ─── Header ─── */
    .header {
      text-align: center;
      margin-bottom: 32px;
      animation: fade-up 0.6s ease-out both;
    }

    .avatar-ring {
      display: inline-block;
      padding: 3px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      margin-bottom: 16px;
      animation: ring-glow 4s ease-in-out infinite;
    }

    @keyframes ring-glow {
      0%, 100% { box-shadow: 0 0 12px var(--accent-glow); }
      50% { box-shadow: 0 0 24px var(--accent-glow), 0 0 48px rgba(0, 229, 255, 0.1); }
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: block;
      background: var(--bg-card);
      object-fit: cover;
    }

    .avatar-fallback {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 28px;
      color: var(--accent);
      letter-spacing: -1px;
    }

    .site-title {
      font-family: var(--font-display);
      font-size: clamp(28px, 6vw, 38px);
      font-weight: 700;
      letter-spacing: 2px;
      margin: 0 0 4px;
      background: linear-gradient(135deg, var(--fg), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .site-subtitle {
      color: var(--fg-dim);
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    /* ─── Social bar ─── */
    .social-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      margin-bottom: 36px;
      animation: fade-up 0.6s ease-out 0.15s both;
    }

    .social-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      width: 100%;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 50px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--fg);
      text-decoration: none;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      transition: all 0.25s ease;
    }

    .social-btn.featured {
      width: 100%;
      justify-content: center;
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 600;
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.1), rgba(0, 229, 255, 0.04));
      border-color: var(--accent-dim);
      color: var(--accent);
      letter-spacing: 0.3px;
    }

    .social-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .social-btn.featured:hover {
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.18), rgba(0, 229, 255, 0.08));
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* ─── Live stream mini-preview (injected by JS when live) ─── */
    .live-mini {
      width: 100%;
      margin-top: 6px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--accent-dim);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.12);
      animation: stream-in 0.4s ease-out;
    }

    @keyframes stream-in {
      from { opacity: 0; max-height: 0; margin-top: 0; }
      to { opacity: 1; max-height: 300px; margin-top: 6px; }
    }

    .live-mini-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.4);
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff3b3b;
      animation: live-pulse 1.5s ease-in-out infinite;
    }

    @keyframes live-pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255, 59, 59, 0.5); }
      50% { opacity: 0.7; box-shadow: 0 0 0 5px rgba(255, 59, 59, 0); }
    }

    .live-mini-viewer {
      margin-left: auto;
      color: var(--fg-dim);
      font-size: 10px;
      letter-spacing: 0;
      font-weight: 500;
    }

    .live-mini-embed {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .live-mini-embed iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* When live, restyle the featured Kick button */
    .social-btn.featured.is-live {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    /* ─── Section label ─── */
    .section-label {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: fade-up 0.6s ease-out 0.3s both;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--accent-dim), transparent);
    }

    /* ─── Product grid ─── */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
      gap: 16px;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      text-decoration: none;
      color: var(--fg);
      transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: flex;
      flex-direction: column;
      animation: fade-up 0.5s ease-out both;
      position: relative;
    }

    .product-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      padding: 1px;
      background: linear-gradient(135deg, transparent, var(--accent), transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    .product-card:hover::before { opacity: 1; }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.3), 0 0 30px var(--accent-glow);
      background: var(--bg-card-hover);
    }

    .product-img-wrap {
      position: relative;
      aspect-ratio: 4 / 3;
      background: var(--bg);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-img-wrap img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
      transition: transform 0.4s ease;
    }

    .product-card:hover .product-img-wrap img { transform: scale(1.08); }

    .product-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 12px;
      border-radius: 50px;
      background: var(--badge-bg);
      color: var(--accent);
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      z-index: 1;
    }

    .img-placeholder {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--fg-dim);
      font-size: 13px;
      text-align: center;
      padding: 20px 16px;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background: linear-gradient(135deg, var(--card-bg) 0%, color-mix(in srgb, var(--accent) 8%, var(--card-bg)) 100%);
    }

    .product-info {
      padding: 16px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .product-category {
      font-size: 11px;
      font-weight: 600;
      color: var(--fg-dim);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .product-name {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 600;
      line-height: 1.3;
    }

    .product-desc {
      font-size: 13px;
      color: var(--fg-dim);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 10px;
    }

    .view-label {
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 13px;
      color: var(--accent);
    }

    .buy-arrow {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      flex-shrink: 0;
    }

    .product-card:hover .buy-arrow {
      transform: translateX(3px);
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .buy-arrow svg {
      width: 16px;
      height: 16px;
    }

    /* ─── Footer ─── */
    .footer {
      text-align: center;
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--fg-dim);
      font-size: 12px;
      animation: fade-up 0.6s ease-out 0.5s both;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    /* ─── Splash screen ─── */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg);
      overflow: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .splash.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Falling doodle icons */
    .splash-rain {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .doodle {
      position: absolute;
      top: -60px;
      opacity: 0;
      animation: doodle-fall 1.4s ease-in forwards;
    }

    .doodle svg {
      width: 32px;
      height: 32px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px var(--accent-glow));
    }

    /* Center logo over the rain */
    .splash-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 1;
    }

    .splash-title {
      font-family: var(--font-display);
      font-size: clamp(32px, 9vw, 56px);
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--accent);
      opacity: 0;
      animation: logo-pop 0.5s ease-out 0.2s forwards;
      text-shadow:
        0 0 20px var(--accent-glow),
        0 0 60px rgba(0, 229, 255, 0.15);
    }

    .splash-sub {
      font-family: var(--font-body);
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--fg-dim);
      opacity: 0;
      animation: logo-pop 0.4s ease-out 0.45s forwards;
    }

    @keyframes logo-pop {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes doodle-fall {
      0% { opacity: 0; transform: translateY(0) rotate(0deg); }
      15% { opacity: 0.5; }
      100% { opacity: 0; transform: translateY(110vh) rotate(var(--rot, 90deg)); }
    }

    /* Hide main content until splash is done */
    .wrapper { opacity: 0; }
    .wrapper.revealed {
      opacity: 1;
      animation: content-reveal 0.5s ease-out;
    }
    @keyframes content-reveal {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ─── Animations ─── */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ─── Music toggle button ─── */
    .music-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--accent-dim);
      background: var(--bg-card);
      color: var(--fg-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      backdrop-filter: blur(8px);
    }

    .music-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 4px 20px var(--accent-glow);
      transform: scale(1.08);
    }

    .music-btn.unmuted {
      border-color: var(--accent);
      color: var(--accent);
      animation: music-pulse 2s ease-in-out infinite;
    }

    .music-btn svg { width: 20px; height: 20px; }

    @keyframes music-pulse {
      0%, 100% { box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
      50% { box-shadow: 0 0 16px var(--accent-glow), 0 4px 16px rgba(0,0,0,0.3); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      .bg-glow { display: none; }
      .splash { display: none; }
      .wrapper { opacity: 1; }
    }
  </style>
</head>
<body>

<!-- ─── Splash intro ─── -->
<div class="splash" id="splash">

    <div class="splash-sub">Gear up &middot; Game on</div>

</div>

<!-- ─── Background music (MP3) ─── -->

<button class="music-btn" id="music-btn" title="Toggle sound" aria-label="Toggle sound">

<div class="bg-glow"></div>

<div class="wrapper" id="main-wrapper">

  <header class="header">

<script>
/*
  ════════════════════════════════════════════════════════════
  HOW TO ADD A NEW SOCIAL LINK:
  Open links.json and add an entry like this:

  { "name": "Twitter", "url": "https://twitter.com/yourname", "icon": "twitter", "row": 2 }

  row: 1 = featured top row (full width), 2 = second row
  Built-in icons: instagram, kick, youtube, store
  For a new icon, add its SVG to the LINK_ICONS object below.

  ════════════════════════════════════════════════════════════
  HOW TO ADD A NEW PRODUCT:
  Open products.json and add an entry like this:

  {
    "id": 3,
    "name": "Product Name",
    "category": "Category",
    "description": "Short description of the product.",
    "image": "https://m.media-amazon.com/images/I/XXXXX._SL1500_.jpg",
    "link": "https://www.amazon.in/dp/XXXXXX",
    "badge": "Tag"
  }

  To get the Amazon image URL:
  1. Open the Amazon product page
  2. Right-click the main product image → "Open image in new tab"
  3. Copy that URL (it'll start with https://m.media-amazon.com/images/...)
  ════════════════════════════════════════════════════════════
*/

// ─── Social links ───
const FALLBACK_LINKS = [
  { "name": "Full Screen Live on KICK", "url": "https://kick.com/fakebtc", "icon": "kick", "row": 1 },
  { "name": "YouTube", "url": "https://www.youtube.com/@FakebtcOG", "icon": "youtube", "row": 2 },
  { "name": "Account Store", "url": "https://chat.whatsapp.com/E0avBhepJ7u6HAfgn4U674", "icon": "store", "row": 2 },
  { "name": "Instagram", "url": "https://instagram.com/fake__btc", "icon": "instagram", "row": 2 }
];

function loadLinks() {
  fetch('links.json')
    .then(function(r) { if (!r.ok) throw new Error(); return r.json(); })
    .then(renderLinks)
    .catch(function() {
      renderLinks(FALLBACK_LINKS);
    });
}

function renderLinks(links) {
  var bar = document.getElementById('social-bar');
  bar.innerHTML = '';

  // Group links by row
  var rows = {};
  links.forEach(function(l) {
    var r = l.row || 1;
    if (!rows[r]) rows[r] = [];
    rows[r].push(l);
  });

  // Render each row
  Object.keys(rows).sort().forEach(function(r) {
    var rowDiv = document.createElement('div');
    rowDiv.className = 'social-row';

    rows[r].forEach(function(l) {
      var a = document.createElement('a');
      a.className = 'social-btn' + (l.row === 1 ? ' featured' : '');
      a.href = l.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = (LINK_ICONS[l.icon] || '') + '\n      ' + esc(l.name);
      rowDiv.appendChild(a);
    });

    bar.appendChild(rowDiv);
  });
}

}

// ─── Kick live check ───
var KICK_CHANNEL = 'fakebtc';

function checkKickLive() {
  fetch('https://kick.com/api/v1/channels/' + KICK_CHANNEL)
    .then(function(r) { if (!r.ok) throw new Error(); return r.json(); })
    .then(function(data) {
      if (data && data.livestream && data.livestream.is_live) {
        showLivePreview(data.livestream);
      }
    })
    .catch(function() {
      // CORS blocked or API unavailable — no preview shown, that's fine
    });
}

function showLivePreview(stream) {
  // Find the featured Kick button (row 1)
  var kickBtn = document.querySelector('.social-btn.featured');
  if (!kickBtn) return;

  // Mark as live — this switches audio source
  isKickLive = true;

  // Add live glow to the button
  kickBtn.classList.add('is-live');

  // Update button text to show LIVE
  kickBtn.innerHTML =
    LINK_ICONS.kick +
    '<span class="live-dot" style="margin-left:4px"></span> LIVE NOW — Watch on Kick';

  // Create mini preview below the button (iframe starts muted)
  var mini = document.createElement('div');
  mini.className = 'live-mini';

  var viewers = stream.viewer_count || 0;
  var title = stream.session_title || '';

  mini.innerHTML =
    '<div class="live-mini-header">' +
      '<span class="live-dot"></span>' +
      (title ? '<span>' + esc(title) + '</span>' : '<span>LIVE</span>') +
      (viewers > 0 ? '<span class="live-mini-viewer">' + viewers + ' watching</span>' : '') +
    '</div>' +
    '<div class="live-mini-embed">' +
      '<iframe src="https://player.kick.com/' + KICK_CHANNEL + '?muted=true" allowfullscreen scrolling="no"></iframe>' +
    '</div>';

  // Insert after the Kick button's parent row
  var row = kickBtn.parentElement;
  row.after(mini);

  // Update audio state (stop MP3 if user had unmuted)
  updateAudioState();
}

// ─── Audio system ───
// Rules:
//   Kick LIVE  → mute MP3, let Kick iframe play with sound
//   Kick OFF   → play MP3 at 25% volume, looped
//   Mute btn   → mutes/unmutes whichever source is active

var bgMusic = document.getElementById('bg-music');
var isMuted = false;      // auto-play after splash
var isKickLive = false;   // updated by checkKickLive()
var BG_VOLUME = 0.25;     // 25%
var hasInteracted = false; // track if user has interacted (needed for autoplay)

bgMusic.volume = BG_VOLUME;

// Listen for first interaction to unlock audio
document.addEventListener('click', function onFirstClick() {
  hasInteracted = true;
  document.removeEventListener('click', onFirstClick);
  if (!isMuted && !isKickLive) {
    bgMusic.play().catch(function() {});
  }
}, { once: true });

function updateAudioState() {
  var btn = document.getElementById('music-btn');
  var iconMuted = document.getElementById('icon-muted');
  var iconUnmuted = document.getElementById('icon-unmuted');

  if (isMuted) {
    // Mute everything
    bgMusic.pause();
    muteKickIframe(true);
    btn.classList.remove('unmuted');
    iconMuted.style.display = '';
    iconUnmuted.style.display = 'none';
  } else {
    btn.classList.add('unmuted');
    iconMuted.style.display = 'none';
    iconUnmuted.style.display = '';

    if (isKickLive) {
      // Kick is live → mute MP3, unmute Kick iframe
      bgMusic.pause();
      muteKickIframe(false);
    } else {
      // No live → play MP3
      bgMusic.volume = BG_VOLUME;
      bgMusic.play().catch(function() {});
      muteKickIframe(true);
    }
  }
}

function muteKickIframe(mute) {
  var iframe = document.querySelector('.live-mini-embed iframe');
  if (!iframe) return;
  try {
    var src = iframe.src;
    // Add or update muted param in the Kick player URL
    if (mute) {
      if (src.indexOf('muted=true') === -1) {
        iframe.src = src.replace('muted=false', 'muted=true');
        if (iframe.src === src && src.indexOf('muted=') === -1) {
          iframe.src = src + (src.indexOf('?') > -1 ? '&' : '?') + 'muted=true';
        }
      }
    } else {
      if (src.indexOf('muted=false') === -1) {
        iframe.src = src.replace('muted=true', 'muted=false');
        if (iframe.src === src && src.indexOf('muted=') === -1) {
          iframe.src = src + (src.indexOf('?') > -1 ? '&' : '?') + 'muted=false';
        }
      }
    }
  } catch(e) {}
}

// Toggle mute/unmute on click
document.getElementById('music-btn').addEventListener('click', function() {
  isMuted = !isMuted;
  updateAudioState();
});

// Load data in background while splash plays
loadLinks();
loadProducts();
checkKickLive();

// Dismiss splash after animation completes (~1.2s)
setTimeout(function() {
  var splash = document.getElementById('splash');
  var wrapper = document.getElementById('main-wrapper');
  splash.classList.add('done');
  wrapper.classList.add('revealed');
  // Clean up splash from DOM after fade-out
  setTimeout(function() { splash.remove(); }, 500);

  // Try to auto-play music after splash (may need user click)
  if (!isMuted && !isKickLive) {
    bgMusic.play().then(function() {
      hasInteracted = true;
      updateAudioState();
    }).catch(function() {
      // Browser blocked autoplay — music starts on first click
    });
  }
  updateAudioState();
}, 1200);
</script>
